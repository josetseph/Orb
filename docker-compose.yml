# Sidecars for the bare benchmark backend: `docker compose up -d`
# (or reuse a running desktop session's Qdrant/Meili on 17433/17470 via QDRANT_PORT / MEILI_PORT).

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: orb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  # Meilisearch Full-Text Search (native Windows binary; replaces Typesense)
  meilisearch:
    image: getmeili/meilisearch:v1.49
    container_name: orb-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: orb-dev-key
      MEILI_DB_PATH: /meili_data
    ports:
      - "7700:7700"
    volumes:
      - ./data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

