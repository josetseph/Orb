# Contributor / optional infra stack only.
# End users run the Orb desktop app (see desktop/) — not this compose file.
# Chat, embed, rerank, Qwen3-ASR, and Marlin all load in-process in the API.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: orb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    volumes:
      - ./data/local_db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d orb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Neo4j removed — graph storage is now embedded Kuzu (no container needed)

  # RustFS Object Storage (optional legacy S3 path — not used by desktop/local STORAGE_BACKEND)
  rustfs:
    profiles: ["legacy-s3"]
    image: rustfs/rustfs:latest
    container_name: orb-rustfs
    restart: unless-stopped
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: orb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  # Meilisearch Full-Text Search (native Windows binary; replaces Typesense)
  meilisearch:
    image: getmeili/meilisearch:v1.49
    container_name: orb-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: orb-dev-key
      MEILI_DB_PATH: /meili_data
    ports:
      - "7700:7700"
    volumes:
      - ./data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orb-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override .env's localhost values with Docker service names inside the network
      QDRANT_HOST: qdrant
      MEILI_HOST: meilisearch
      MEILI_PORT: "7700"
      MEILI_MASTER_KEY: orb-dev-key
      TYPESENSE_HOST: meilisearch
      TYPESENSE_PORT: "7700"
      TYPESENSE_API_KEY: orb-dev-key
      DATABASE_BACKEND: postgres
      STORAGE_BACKEND: local
      FILES_URL: /files/orb-assets
      INGESTION_PIPELINE_CONCURRENCY: 1
      MULTIMEDIA_CONCURRENCY: 1
      DATABASE_TRANSACTION_POOLER_URL: postgresql://user:password@postgres:5432/orb
      DATABASE_SESSION_POOLER_URL: postgresql://user:password@postgres:5432/orb
      DATABASE_DIRECT_CONNECTION_URL: postgresql://user:password@postgres:5432/orb
    ports:
      - "8700:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      meilisearch:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orb-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "/api/v1"
      NEXT_PUBLIC_FILES_URL: "/files/orb-assets"
    ports:
      - "3700:3000"
    depends_on:
      - backend
