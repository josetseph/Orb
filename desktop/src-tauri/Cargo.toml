[package]
name = "orb"
version = "0.3.0"
description = "Orb desktop shell"
authors = ["Joseph Etse <projects@josetseph.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
