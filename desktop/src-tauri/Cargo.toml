[package]
name = "orb"
version = "1.2.0"
description = "Orb desktop shell"
authors = ["Joseph Etse <projects@josetseph.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

# Already in the tree through the webview; used to switch on WebKit's grammar checking.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }

[profile.release]
# Line tables into a separate orb.dSYM (build.py keeps one per build), so a
# crash report's Orb frames can be decoded; the shipped binary stays stripped.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# Tests throw and catch a real Objective-C exception.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }
