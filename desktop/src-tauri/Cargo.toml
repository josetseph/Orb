[package]
name = "orb"
version = "1.1.0"
description = "Orb desktop shell"
authors = ["Joseph Etse <projects@josetseph.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Already in the tree through the webview; used to switch on WebKit's grammar checking.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
