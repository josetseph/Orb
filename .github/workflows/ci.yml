name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # llama-cpp-python has no Linux wheel; build a portable CPU binary once,
      # then the pip cache (keyed on the requirements files) serves it.
      CMAKE_ARGS: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install --prefer-binary -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/unit -q
        env:
          DATA_DIR: ${{ runner.temp }}/orb-data
          ORB_DATA_DIR: ${{ runner.temp }}/orb-data
      # Separate process on purpose: the integration tests boot the real app.
      - run: python -m pytest tests/integration -q
        env:
          DATA_DIR: ${{ runner.temp }}/orb-data-integration
          ORB_DATA_DIR: ${{ runner.temp }}/orb-data-integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # tsc --noEmit && vite build
      - run: npm test

  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Webkit deps (same set the release job installs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --locked
        working-directory: desktop/src-tauri
