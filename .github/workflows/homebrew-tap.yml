name: Homebrew tap

# Point josetseph/homebrew-orb's cask at a desktop release once it is
# published (drafts' download URLs are not public). Needs the repo secret
# HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read/write on
# josetseph/homebrew-orb only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. desktop-v1.0.1"
        required: true

jobs:
  cask:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'desktop-v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checksum the macOS disk images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#desktop-v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p "Orb_${VERSION}_aarch64.dmg" -p "Orb_${VERSION}_x64.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARM_SHA=$(sha256sum "Orb_${VERSION}_aarch64.dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "INTEL_SHA=$(sha256sum "Orb_${VERSION}_x64.dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          repository: josetseph/homebrew-orb
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update and push the cask
        working-directory: tap
        run: |
          sed -i -E \
            -e "s/^(  version \")[^\"]+\"/\1${VERSION}\"/" \
            -e "s/(sha256 arm: +\")[0-9a-f]+\"/\1${ARM_SHA}\"/" \
            -e "s/(intel: +\")[0-9a-f]+\"/\1${INTEL_SHA}\"/" \
            Casks/orb.rb
          grep -q "version \"${VERSION}\"" Casks/orb.rb
          grep -q "${ARM_SHA}" Casks/orb.rb
          grep -q "${INTEL_SHA}" Casks/orb.rb
          git diff --quiet && { echo "Cask already at ${VERSION}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Orb ${VERSION}"
          git push
