name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

env:
  ORB_PYTHON_RELEASE: "20250317"
  ORB_PYTHON_VERSION: "3.12.9"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-14
            bundles: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: mac-x64
            # macos-13 is retired; macos-15-intel is GitHub's remaining x64 macOS runner.
            os: macos-15-intel
            bundles: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            bundles: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            bundles: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      # Node builds the React UI only; nothing from it ships.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build tools (macOS — cmake for llama-cpp-python)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Build tools (Linux — webkit for Tauri, cmake for llama-cpp-python)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Prepare resources (Python + backend, UI, Firefly seed)
        run: python3 desktop/build.py prepare

      - name: Build installer (unsigned)
        run: python3 desktop/build.py dist

      - uses: actions/upload-artifact@v6
        with:
          name: orb-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # Draft a GitHub Release from the four platform artifacts; publish it by hand
  # after a smoke test of each installer.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: bundles
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Orb ${TAG#desktop-v}" bundles/*
