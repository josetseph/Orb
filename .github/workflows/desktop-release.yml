name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

env:
  ORB_PYTHON_RELEASE: "20250317"
  ORB_PYTHON_VERSION: "3.12.9"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-14
            bundles: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - name: mac-x64
            # macos-13 is retired; macos-15-intel is GitHub's remaining x64 macOS runner.
            os: macos-15-intel
            bundles: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - name: windows-x64
            os: windows-latest
            bundles: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: linux-x64
            os: ubuntu-22.04
            bundles: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      # Node builds the React UI only; nothing from it ships.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Prebuilt binary; `cargo install tauri-cli` compiled it from source for
      # 6-27 minutes per job.
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build tools (macOS — cmake for llama-cpp-python)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Build tools (Linux — webkit for Tauri, cmake for llama-cpp-python)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Prepare resources (Python + backend, UI, Firefly seed)
        run: python3 desktop/build.py prepare

      # Not code signing: the key signs the in-app update archives, which the
      # app checks against the public key in tauri.conf.json.
      - name: Build installer (unsigned)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password; unset, Tauri tries to prompt for one and fails.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: python3 desktop/build.py dist

      - uses: actions/upload-artifact@v6
        with:
          name: orb-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # Draft a GitHub Release from the four platform artifacts; publish it by hand
  # after a smoke test of each installer.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: bundles
          merge-multiple: true
      # The in-app updater reads releases/latest/download/latest.json.
      - name: Update feed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib
          tag = os.environ["TAG"]; version = tag.removeprefix("desktop-v")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          files = {p.name: p for p in pathlib.Path("bundles").rglob("*") if p.is_file()}
          targets = {
              "darwin-aarch64": f"Orb_{version}_aarch64.app.tar.gz",
              "darwin-x86_64": f"Orb_{version}_x64.app.tar.gz",
              "windows-x86_64": f"Orb_{version}_x64-setup.exe",
          }
          # A missing signature fails the release: an update feed without a
          # platform would leave its users stuck.
          platforms = {
              key: {"url": f"{base}/{name}", "signature": files[name + ".sig"].read_text().strip()}
              for key, name in targets.items()
          }
          feed = {"version": version, "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "notes": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
                  "platforms": platforms}
          pathlib.Path("bundles/latest.json").write_text(json.dumps(feed, indent=2))
          PY
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Files only: an artifact with several glob paths keeps its subfolders.
          find bundles -type f | xargs gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "Orb ${TAG#desktop-v}"
